services:
  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniguard-core-api:latest
    container_name: omniguard-core
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omniguard
      SPRING_DATASOURCE_USERNAME: omniguard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PASETO_LOCAL_KEY: ${PASETO_LOCAL_KEY}
      PASETO_PUBLIC_KEY: ${PASETO_PUBLIC_KEY}
      PASETO_PRIVATE_KEY: ${PASETO_PRIVATE_KEY}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@omniguard.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
    networks:
      - omniguard-network

networks:
  omniguard-network:
    name: omniguard-infra_omniguard
    external: true
