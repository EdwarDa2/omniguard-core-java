# ============================================================
# OmniGuard Core API - Configuración Principal
# ============================================================

spring:
  application:
    name: omniguard-core-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ============================================================
  # Base de Datos (PostgreSQL)
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omniguard}
    username: ${SPRING_DATASOURCE_USERNAME:omniguard}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      pool-name: OmniGuardHikariPool

  # ============================================================
  # JPA / Hibernate
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 20

  # ============================================================
  # Flyway (Migraciones)
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ============================================================
  # Redis
  # ============================================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms

  # ============================================================
  # Web / MVC
  # ============================================================
  mvc:
    async:
      request-timeout: 30s
  web:
    resources:
      cache:
        period: 3600

  # ============================================================
  # Jackson
  # ============================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: non_null

# ============================================================
# Server
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /
    session:
      timeout: 15m
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  http2:
    enabled: true

# ============================================================
# Actuator / Management
# ============================================================
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump,threaddump
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
      threshold: 100MB
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE}
    export:
      prometheus:
        enabled: true
        step: 15s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      sla:
        http.server.requests: 500ms,1s,2s

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.omniguard: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB

# ============================================================
# PASETO Configuration
# ============================================================
paseto:
  access-token-ttl-minutes: ${PASETO_ACCESS_TOKEN_TTL_MINUTES:15}
  refresh-token-ttl-days: ${PASETO_REFRESH_TOKEN_TTL_DAYS:30}
  local-key: ${PASETO_LOCAL_KEY:}          # Base64 encoded 32 bytes (v4.local)
  public-key: ${PASETO_PUBLIC_KEY:}        # Base64 encoded Ed25519 public key
  private-key: ${PASETO_PRIVATE_KEY:}      # Base64 encoded Ed25519 private key

# ============================================================
# Rate Limiting (Bucket4j + Redis) - Configurado via @ConfigurationProperties
# Prefijo: bucket4j.rules (ver RateLimitProperties)
# ============================================================
bucket4j:
  enabled: true
  rules:
    auth:login:
      capacity: 5
      refill-tokens: 5
      refill-period: 1m
      distributed: true
    auth:register:
      capacity: 3
      refill-tokens: 3
      refill-period: 1m
      distributed: true
    auth:refresh:
      capacity: 10
      refill-tokens: 10
      refill-period: 1m
      distributed: true
    api:default:
      capacity: 100
      refill-tokens: 100
      refill-period: 1m
      distributed: true
    sse:stream:
      capacity: 10
      refill-tokens: 10
      refill-period: 1m
      distributed: true

# ============================================================
# App Custom Properties
# ============================================================
app:
  domain: ${APP_DOMAIN:https://localhost}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:3000}
  audit:
    enabled: true
    async: true